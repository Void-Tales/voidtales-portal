name: Build Docker images
# Workflow name displayed in the GitHub Actions UI.
permissions: # Grant minimal permissions required for this workflow:
  contents: read # read is needed to check out the repository code

on:
  push:
    branches: ['main']
# Triggers the workflow on every push to the 'main' branch.

concurrency:
  # Zwei Devlog-Posts kurz hintereinander = sonst zwei parallele Builds, und
  # welcher Deploy-Webhook zuletzt feuert, ist Zufall. Nicht abbrechen: ein
  # laufender Build muss seinen Commit noch ausliefern duerfen.
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build-and-push-dockerfile-image:
    # A single job to build and push the Docker image.
    runs-on: ubuntu-latest

    # 1. Define an Environment for the job
    environment:
      # Sets the environment name, which can be used for deployment protection rules.
      name: production
      # Provides a URL link to the deployed application.
      url: https://portal.voidtales.win/

    steps:
      - name: 📥 Checkout repo
        # Checks out your repository code so the job can access it.
        uses: actions/checkout@v5

      - name: 🔧 Set up Docker Buildx
        # Needed for the GHA cache backend below.
        uses: docker/setup-buildx-action@v3

      - name: 🔧 Log in to Docker Hub
        # Logs in to Docker Hub using secrets for secure authentication.
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }} # Make sure to add the secrets in your repository in -> Settings -> Secrets (Actions) -> New repository secret
          password: ${{ secrets.DOCKERHUB_TOKEN }} # Make sure to add the secrets in your repository in -> Settings -> Secrets (Actions) -> New repository secret

      - name: 🔑 Hash the media host listing
        # The media layer in the Dockerfile downloads ~550 MB of news/devlog
        # originals and re-encodes them to WebP. It must only rerun when a file
        # on the media host was actually added or removed, so the layer is keyed
        # on a digest of both directory listings rather than on the commit.
        id: media
        run: |
          # Cache-Buster: nginx-Autoindex ignoriert die Query, Cloudflare sieht
          # eine eigene URL. Ohne das friert eine Edge-Cache-Regel fuer den
          # Media-Host den Digest ein und neue Bilder gehen als 404 live.
          cb=$(date +%s)
          key=$( { curl -fsS --max-time 30 "https://media.voidtales.win/news/?cb=$cb" \
                   && curl -fsS --max-time 30 "https://media.voidtales.win/devlog/?cb=$cb" ; } \
                 | grep -o 'href="[^"]*"' | sort | sha256sum | cut -c1-16 )
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "media digest: $key"

      - name: 🔨 Build and push Docker image
        # Builds the Docker image from your Dockerfile and pushes it to Docker Hub.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            MEDIA_DIGEST=${{ steps.media.outputs.key }}
          # Defines the image tags, including your Docker Hub namespace.
          tags: |
            inventory69/voidtales-portal:latest
            inventory69/voidtales-portal:${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Adds this step at the end of your existing workflow
      - name: 🚀 Trigger Dokploy Deployment
        # Deploy webhook (Settings → General → Deployments in Dokploy): no
        # auth header needed, Dokploy re-pulls whatever image is configured.
        # -fsS: fail on 4xx/5xx instead of leaving the run green on a Dokploy-side error.
        id: 'laststep'
        run: |
          curl -fsS -X POST -H "Content-Type: application/json" -d '{}' \
          "${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}"
