server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /404.html;
    }

    # Fingerprinted build assets and images never change under the same URL.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /images/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Container healthcheck target (Dokploy).
    location = /health.html {
        add_header Cache-Control "no-store";
    }
}
