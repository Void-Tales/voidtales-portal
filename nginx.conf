server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The directory-index redirect (/news -> /news/) otherwise goes out as an
    # absolute http:// URL, because nginx only ever sees plain HTTP behind
    # Traefik and Cloudflare. Relative redirects keep the client's own scheme.
    absolute_redirect off;

    # `/404.html` as the try_files fallback served the error page with a 200,
    # so every unknown path looked like a real one to crawlers. `=404` makes
    # nginx raise a proper 404 and error_page picks the page up from there.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    # Content-hashed names never change under the same URL: a year, immutable.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /images/items/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else under /images/ keeps its name when the file changes: the
    # OG card of a post, index-*/portal-*, news/devlog WebPs named after their
    # original. A year of immutable kept the old file in browsers and at the edge.
    location /images/ {
        add_header Cache-Control "public, max-age=86400, must-revalidate";
    }

    # Container healthcheck target (Dokploy).
    location = /health.html {
        add_header Cache-Control "no-store";
    }
}
