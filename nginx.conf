server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # `/404.html` as the try_files fallback served the error page with a 200,
    # so every unknown path looked like a real one to crawlers. `=404` makes
    # nginx raise a proper 404 and error_page picks the page up from there.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    # Fingerprinted build assets and images never change under the same URL.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /images/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Container healthcheck target (Dokploy).
    location = /health.html {
        add_header Cache-Control "no-store";
    }
}
